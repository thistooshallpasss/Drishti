<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="drishti-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="pupil-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <filter id="neon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="128" fill="#030712" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#drishti-glow)" stroke-width="6" opacity="0.6" />

  <!-- Eye Outer Aura -->
  <g filter="url(#neon-shadow)">
    <!-- Eye Contour -->
    <path
      d="M 56 256 C 140 130, 372 130, 456 256 C 372 382, 140 382, 56 256 Z"
      fill="none"
      stroke="url(#drishti-glow)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Iris Circle -->
    <circle cx="256" cy="256" r="88" fill="url(#pupil-glow)" stroke="#38bdf8" stroke-width="12" />

    <!-- Third Eye Focus Pupil -->
    <circle cx="256" cy="256" r="38" fill="#ffffff" />
    <circle cx="270" cy="242" r="12" fill="#38bdf8" opacity="0.85" />

    <!-- Top Focus Ray / Bindu -->
    <circle cx="256" cy="118" r="14" fill="#38bdf8" />
    <circle cx="256" cy="394" r="14" fill="#c084fc" />
  </g>
</svg>
